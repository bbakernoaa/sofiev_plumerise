name: Python and Fortran CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran compiler and CMake
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Lint Fortran code
        run: |
          pip install fprettify
          fprettify --diff --recursive src/fortran

      - name: Configure, build, and test Fortran code
        run: |
          rm -rf build
          cmake -S . -B build
          cmake --build build
          cd build
          ctest

      - name: Test with pytest
        run: pytest
