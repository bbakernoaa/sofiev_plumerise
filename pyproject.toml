[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "sofiev_plume_model"
version = "0.1.0"
dependencies = [
    "cftime",
    "dask",
    "xgboost",
    "xarray",
    "h5netcdf",
    "pandas",
    "scipy",
    "numpy",
    "scikit-learn",
    "s3fs",
    "sentinelsat",
    "earthaccess",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
